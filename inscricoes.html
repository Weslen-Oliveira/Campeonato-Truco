<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/inscricoes.css">
    <title>Campeonato de Truco</title>
</head>
<body>
    <div class="container">
        <div class="header">
          <h2>Cadastro - Torneio de Truco</h2>
          <p>Preencha o formulário abaixo para participar</p>
          <div class="card-deck">
            <div class="card">A</div>
            <div class="card">7</div>
            <div class="card">K</div>
          </div>
        </div>
        
        <div class="form-container">
          <form id="trucoCadastro" onsubmit="return validateForm()">
            <div class="form-group">
              <label for="nome">Nome Completo</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
            </div>
            
            <div class="form-group">
                <label>Modalidade</label>
                <select class="form-control" id="nivel" required>
                    <option value="">Selecione sua Modalidade</option>
                    <option value="iniciante">Iniciante</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                  </select>
            </div>
            
            <!-- <div class="form-group">
              <label>Nível</label>
              <select class="form-control" id="nivel" required>
                <option value="">Selecione seu nível</option>
                <option value="iniciante">Iniciante</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>
              </select>
            </div> -->
            
            <div class="form-group">
              <label>Sexo</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="sexo" value="masculino" required> Masculino
                </label>
                <label class="radio-label">
                  <input type="radio" name="sexo" value="feminino"> Feminino
                </label>
              </div>
            </div>
            
            <div class="form-group">
              <label for="dataInicio">Data de Início</label>
              <input type="date" class="form-control" id="dataInicio" required>
            </div>
            
            <div class="form-group">
              <label for="dataTermino">Data de Término</label>
              <input type="date" class="form-control" id="dataTermino" required>
            </div>
            
            <div class="form-group">
              <label for="valorContratacao">Valor da Contratação (R$)</label>
              <input type="number" class="form-control" id="valorContratacao" min="0" step="0.01" placeholder="0,00" required>
            </div>
            
            <div class="form-group">
              <label>Forma de Pagamento</label>
              <div class="payment-options">
                <div class="payment-option" onclick="selectPayment(this)" data-payment="pix">
                  PIX
                </div>
                <div class="payment-option" onclick="selectPayment(this)" data-payment="cartao">
                  Cartão de Crédito
                </div>
                <div class="payment-option" onclick="selectPayment(this)" data-payment="boleto">
                  Boleto Bancário
                </div>
                <div class="payment-option" onclick="selectPayment(this)" data-payment="dinheiro">
                  Dinheiro
                </div>
              </div>
              <input type="hidden" id="formaPagamento" name="formaPagamento" required>
            </div>
            
            <button type="submit" class="submit-btn">CONFIRMAR INSCRIÇÃO</button>
          </form>
        </div>
      </div>
    
    <script src="js/script.js"></script>
    <script src="js/inscricoes.js"></script>
</body>
</html>
